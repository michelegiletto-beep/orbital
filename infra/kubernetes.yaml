apiVersion: v1
kind: Namespace
metadata:
  name: orbital-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbital-api
  namespace: orbital-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: orbital-api }
  template:
    metadata:
      labels: { app: orbital-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 1000,
          fsGroup: 1000,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: api
          image: orbital:0.1.0
          ports: [{ containerPort: 4318 }]
          envFrom: [{ configMapRef: { name: orbital-config } }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOST, value: 0.0.0.0 }
            - { name: DATA_DIR, value: /data }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          resources:
            {
              requests: { cpu: 100m, memory: 128Mi },
              limits: { cpu: "1", memory: 512Mi },
            }
          readinessProbe: { httpGet: { path: /health, port: 4318 } }
          livenessProbe: { httpGet: { path: /health, port: 4318 } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        [{ name: data, persistentVolumeClaim: { claimName: orbital-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: orbital-api, namespace: orbital-staging }
spec:
  selector: { app: orbital-api }
  ports: [{ port: 4318, targetPort: 4318 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: orbital-staging }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
